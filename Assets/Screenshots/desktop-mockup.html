<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuitBatch desktop preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1600px; height: 900px; margin: 0; overflow: hidden; }
    body { position: relative; color: #f5f8ff; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; background: #071225; }
    .wallpaper { position: absolute; inset: -5px; background: url("mockup-wallpaper.png") center / cover no-repeat; filter: hue-rotate(17deg) saturate(.72); }
    .wash { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4, 13, 29, .65), rgba(4, 13, 29, .18) 62%, rgba(4, 13, 29, .08)); }
    .menubar { position: relative; z-index: 2; height: 38px; display: flex; align-items: center; gap: 23px; padding: 0 25px; background: rgba(5, 13, 27, .56); border-bottom: 1px solid rgba(255, 255, 255, .09); font-size: 14px; }
    .menubar strong { font-weight: 650; }
    .menubar .spacer { flex: 1; }
    .menubar .status { color: rgba(255, 255, 255, .78); }
    .hero { position: absolute; z-index: 2; left: 94px; top: 290px; width: 670px; }
    .hero .mark { width: 54px; height: 54px; display: grid; place-items: center; margin-bottom: 34px; background: #087df0; border: 1px solid rgba(255, 255, 255, .22); border-radius: 14px; box-shadow: 0 14px 36px rgba(3, 21, 53, .25); }
    .hero .mark svg { width: 30px; height: 30px; }
    h1 { max-width: 630px; margin: 0; font-size: 68px; line-height: 1.03; letter-spacing: -.055em; font-weight: 720; }
    .hero p { max-width: 570px; margin: 22px 0 0; color: rgba(245, 248, 255, .79); font-size: 22px; line-height: 1.35; letter-spacing: -.018em; }
    .panel { position: absolute; z-index: 2; top: 66px; right: 85px; width: 560px; height: 785px; filter: drop-shadow(0 32px 54px rgba(0, 0, 0, .42)); }
    .panel::before { content: ""; position: absolute; top: -10px; left: calc(50% - 10px); width: 20px; height: 20px; transform: rotate(45deg); background: #2e2e2f; border-radius: 4px; }
    .panel .surface { position: relative; height: 100%; overflow: hidden; border: 1px solid rgba(255, 255, 255, .17); border-radius: 18px; background: #303031; }
    .panel img { position: absolute; top: -79px; left: -63px; width: 686px; max-width: none; height: auto; display: block; }
    .note { position: absolute; z-index: 2; left: 96px; bottom: 49px; font-size: 14px; color: rgba(245, 248, 255, .68); }
    .dock { position: absolute; z-index: 2; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 11px; border: 1px solid rgba(255, 255, 255, .22); border-radius: 18px; background: rgba(226, 236, 255, .12); backdrop-filter: blur(18px); box-shadow: 0 10px 24px rgba(0, 0, 0, .21); }
    .dock i { width: 37px; height: 37px; display: grid; place-items: center; border-radius: 10px; font-size: 20px; font-style: normal; font-weight: 600; box-shadow: inset 0 1px rgba(255, 255, 255, .3); }
    .dock .finder { background: #4699d6; }
    .dock .notes { color: #333b48; background: linear-gradient(#f5d157 23%, #f7f7f7 23%); }
    .dock .mail { background: #397bc3; }
    .dock .settings { color: #dce4ee; background: #57677d; }
  </style>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div><div class="wash" aria-hidden="true"></div>
  <div class="menubar" aria-hidden="true"><strong>QuitBatch</strong><span>File</span><span>View</span><span class="spacer"></span><span class="status">Tue 10:13</span></div>
  <div class="hero">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="3" y="5" width="20" height="17" rx="3" stroke="white" stroke-width="2.5"/><rect x="9" y="10" width="20" height="17" rx="3" fill="#087df0" stroke="white" stroke-width="2.5"/><path d="m16 17 7 7m0-7-7 7" stroke="white" stroke-linecap="round" stroke-width="2.5"/></svg></div>
    <h1>Quit apps together.</h1>
    <p>Choose apps now, save a routine for later.</p>
  </div>
  <div class="panel" aria-label="QuitBatch profile preview"><div class="surface"><img src="profile-hero.png" alt="QuitBatch profile panel with the system blue accent"></div></div>
  <div class="note">Illustrative desktop · app interface captured from a demo profile</div>
  <div class="dock" aria-hidden="true"><i class="finder">⌂</i><i class="notes">≡</i><i class="mail">✉</i><i class="settings">⚙</i></div>
</body>
</html>
