<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuitBatch desktop mockup</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1600px; height: 1000px; margin: 0; overflow: hidden; }
    body {
      color: #f5f5fa;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #0a1023 url("mockup-wallpaper.png") center / cover no-repeat;
    }
    .menubar {
      height: 39px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 24px;
      background: rgba(5, 10, 24, .40);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, .10);
      font-size: 14px;
      letter-spacing: -.01em;
    }
    .menubar .app-name { font-weight: 700; }
    .menubar .spacer { flex: 1; }
    .menubar .status { color: rgba(255, 255, 255, .85); }
    .menubar .status-icon {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .16);
      border-radius: 6px;
      font-size: 17px;
      line-height: 1;
    }
    .panel {
      position: absolute;
      top: 60px;
      right: 72px;
      width: 460px;
      height: 754px;
      overflow: visible;
      filter: drop-shadow(0 30px 62px rgba(0, 0, 0, .52));
    }
    .panel::before {
      content: "";
      position: absolute;
      top: -10px;
      left: calc(50% - 10px);
      width: 20px;
      height: 20px;
      transform: rotate(45deg);
      background: #2f2f30;
      border-radius: 4px;
    }
    .panel .surface {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, .17);
      background: #303030;
    }
    .panel img {
      position: absolute;
      top: -30px;
      left: 0;
      width: 460px;
      max-width: none;
      height: auto;
      display: block;
    }
    .caption {
      position: absolute;
      left: 70px;
      bottom: 95px;
      padding-left: 17px;
      border-left: 2px solid rgba(202, 185, 239, .85);
      text-shadow: 0 1px 10px rgba(0, 0, 0, .26);
    }
    .caption strong { display: block; font-size: 30px; font-weight: 650; letter-spacing: -.04em; }
    .caption span { display: block; margin-top: 7px; color: rgba(245, 245, 250, .77); font-size: 15px; }
    .dock {
      position: absolute;
      bottom: 19px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 19px;
      background: rgba(235, 240, 255, .15);
      backdrop-filter: blur(24px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .19);
    }
    .dock i {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      font-size: 19px;
      font-style: normal;
      font-weight: 600;
      box-shadow: inset 0 1px rgba(255, 255, 255, .35), 0 2px 8px rgba(0, 0, 0, .23);
    }
    .dock .one { background: linear-gradient(140deg, #5db8ed, #255ea4); }
    .dock .two { color: #4c5366; background: linear-gradient(180deg, #f7eec0 25%, #f5f7fb 25%); }
    .dock .three { background: linear-gradient(135deg, #416ec0, #294772); }
    .dock .four { background: linear-gradient(140deg, #8a80d5, #594b9a); }
    .dock .five { background: linear-gradient(140deg, #9ea8ba, #515c73); }
  </style>
</head>
<body>
  <div class="menubar" aria-hidden="true">
    <span class="app-name">Desktop</span><span>File</span><span>View</span>
    <span class="spacer"></span>
    <span class="status-icon">▣</span><span class="status">◔</span><span class="status">⌁</span><span class="status">Tue 10:13</span>
  </div>
  <div class="panel" aria-label="QuitBatch profile preview">
    <div class="surface"><img src="profiles.png" alt="QuitBatch profile panel"></div>
  </div>
  <div class="caption"><strong>QuitBatch</strong><span>Illustrative desktop mockup · real app interface</span></div>
  <div class="dock" aria-hidden="true"><i class="one">⌂</i><i class="two">≡</i><i class="three">▣</i><i class="four">♫</i><i class="five">⚙</i></div>
</body>
</html>
